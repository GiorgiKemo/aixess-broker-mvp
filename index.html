<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171411" />
    <meta name="description" content="AiXESS broker access for premium real-estate opportunities." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" type="image/svg+xml" href="/brand/aixess-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/aixess-mark-180.png" />
    <!-- Homepage hero photo (same srcset/sizes as HomeHero) so it arrives together with the title. -->
    <link
      rel="preload"
      as="image"
      href="/assets/projects/reverance-skyline-1440.webp"
      imagesrcset="/assets/projects/reverance-skyline-720.webp 720w, /assets/projects/reverance-skyline-1440.webp 1440w, /assets/projects/reverance-skyline-2160.webp 2160w, /assets/projects/reverance-skyline-2700.webp 2700w"

      fetchpriority="high"
      type="image/webp"
    />
    <title>AiXESS — Turn Your Network Into Opportunity</title>
    <!-- Time-of-day theme before first paint (AIXCO.Global v4 rules; keep in sync with src/timeTheme.js). -->
    <script>(function(){var m="auto";try{m=localStorage.getItem("aixess-time-theme")||"auto"}catch(e){}if(m!=="day"&&m!=="afternoon"&&m!=="night")m="auto";var h=new Date().getHours();var t=m==="auto"?(h>=6&&h<14?"day":h>=14&&h<19?"afternoon":"night"):m;var d=document.documentElement;d.dataset.timeTheme=t;d.dataset.timeThemeMode=m;})();</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
